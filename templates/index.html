<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>NGX AI‑Driven Investment Solutions System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(145deg, #202a43 0%, #346cb6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .dashboard {
      width: 100%;
      max-width: 1440px;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(20px);
      border-radius: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255,255,255,0.6);
    }
    .main-header {
      background: linear-gradient(105deg, #0b2b5e 0%, #1e4b8c 100%);
      padding: 1.4rem 2rem;
      color: white;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    .logo-area h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #d4e2ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .market-badge {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 500;
      font-size: 0.9rem;
      border: 1px solid rgba(255,255,255,0.25);
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #9ca3af;
      display: inline-block;
    }
    .status-dot.open {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }
    .status-dot.closed {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }
    #market-last-updated {
      opacity: 0.8;
      font-size: 0.8rem;
    }
    .content-grid {
      display: flex;
      flex: 1;
      min-height: 0;
      height: 75vh;
      max-height: 800px;
    }
    .chat-panel {
      flex: 1 1 55%;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-right: 1px solid #e9edf4;
      min-width: 320px;
    }
    .chat-header {
      padding: 1rem 1.5rem;
      background: #f8fafd;
      border-bottom: 1px solid #e9edf4;
      font-weight: 600;
      color: #1e3a8a;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    #chat-status {
      font-size: 0.8rem;
      font-weight: 500;
      margin-left: auto;
      background: #eef2ff;
      padding: 0.3rem 0.8rem;
      border-radius: 1rem;
    }
    .clear-btn {
      background: none;
      border: none;
      color: #6b7280;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0.2rem 0.5rem;
      border-radius: 0.5rem;
      transition: background 0.2s;
      display: flex;
      align-items: center;
    }
    .clear-btn:hover {
      background: #fee2e2;
      color: #b91c1c;
    }
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: #fdfdfd;
      scroll-behavior: smooth;
    }
    .message-bubble {
      max-width: 85%;
      padding: 0.8rem 1.2rem;
      border-radius: 1.2rem;
      line-height: 1.5;
      font-size: 0.95rem;
      word-wrap: break-word;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .user-bubble {
      align-self: flex-end;
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 0.3rem;
    }
    .assistant-bubble {
      align-self: flex-start;
      background: #f1f5f9;
      color: #1e293b;
      border-bottom-left-radius: 0.3rem;
      white-space: pre-wrap;
    }
    .input-area {
      display: flex;
      padding: 1rem 1.2rem;
      gap: 0.7rem;
      border-top: 1px solid #e9edf4;
      background: #ffffff;
    }
    #prompt {
      flex: 1;
      padding: 0.8rem 1.2rem;
      border: 1.5px solid #d1d5db;
      border-radius: 2rem;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
      background: #f9fafb;
    }
    #prompt:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
      background: white;
    }
    .send-btn {
      background: #2563eb;
      border: none;
      color: white;
      padding: 0 1.6rem;
      border-radius: 2rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.95rem;
    }
    .send-btn:hover { background: #1d4ed8; }
    .market-panel {
      flex: 1 1 45%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      min-width: 360px;
      border-left: 1px solid #e9edf4;
    }
    .market-header {
      padding: 1rem 1.5rem;
      background: #f8fafd;
      border-bottom: 1px solid #e9edf4;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .market-header h3 {
      font-weight: 700;
      color: #0b2b5e;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .search-wrapper {
      position: relative;
      flex: 1;
      max-width: 240px;
    }
    #stock-search {
      width: 100%;
      padding: 0.5rem 2rem 0.5rem 1rem;
      border-radius: 2rem;
      border: 1.5px solid #d1d5db;
      font-size: 0.85rem;
      background: white;
      outline: none;
      transition: 0.2s;
    }
    #stock-search:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .search-icon {
      position: absolute;
      right: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      font-size: 0.9rem;
    }
    .refresh-btn {
      background: white;
      border: 1.5px solid #d1d5db;
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      font-weight: 500;
      color: #1f2937;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.2s;
      font-size: 0.85rem;
    }
    .refresh-btn:hover {
      background: #f3f4f6;
      border-color: #2563eb;
    }
    .stock-table-container {
      flex: 1;
      overflow-y: auto;
      padding: 0 0.2rem;
      margin: 0.4rem 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th {
      text-align: left;
      padding: 0.7rem 0.8rem;
      background: #f9fafb;
      color: #4b5563;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      position: sticky;
      top: 0;
      background: #f9fafb;
      box-shadow: 0 1px 0 #e5e7eb;
    }
    td {
      padding: 0.65rem 0.8rem;
      border-bottom: 1px solid #f1f5f9;
      color: #1f2937;
    }
    .stock-row:hover { background: #f0f4ff; }
    .positive { color: #10b981; font-weight: 600; }
    .negative { color: #ef4444; font-weight: 600; }
    .neutral { color: #6b7280; }
    .loading-market { padding: 2rem; text-align: center; color: #6b7280; }
    .error-message {
      background: #fee2e2;
      color: #b91c1c;
      padding: 0.8rem;
      border-radius: 0.5rem;
      margin: 1rem;
      font-size: 0.9rem;
    }
    @media (max-width: 850px) {
      .content-grid { flex-direction: column; height: auto; max-height: none; }
      .chat-panel, .market-panel { flex: 1 1 auto; min-width: 100%; border-right: none; border-left: none; }
      .chat-panel { border-bottom: 1px solid #e9edf4; }
      .market-panel { max-height: 60vh; }
    }
  </style>
</head>
<body>
<div class="dashboard">
  <header class="main-header">
    <div class="logo-area">
      <h1>📈 NGX AI Investment System</h1>
    </div>
    <div class="market-badge" id="market-summary">
      <span class="status-indicator">
        <span class="status-dot" id="status-dot"></span>
        <span id="exchange-status">--</span>
      </span>
      <span id="market-last-updated">Fetching data...</span>
    </div>
  </header>

  <div class="content-grid">
    <!-- Chat -->
    <div class="chat-panel">
      <div class="chat-header">
        <span>💬 AI Assistant</span>
        <span id="chat-status">Connecting...</span>
        <button class="clear-btn" id="clear-chat" title="Clear chat history">🗑️</button>
      </div>
      <div class="messages-container" id="messages"></div>
      <div class="input-area">
        <input id="prompt" type="text" placeholder="Ask about stocks, analysis..." autofocus />
        <button class="send-btn" id="send">➤ Send</button>
      </div>
    </div>

    <!-- Market -->
    <div class="market-panel">
      <div class="market-header">
        <h3>📊 NGX Live Tickers</h3>
        <div class="search-wrapper">
          <input type="text" id="stock-search" placeholder="Filter by symbol/name..." />
          <span class="search-icon">🔍</span>
        </div>
        <button class="refresh-btn" id="refresh-market">↻ Refresh</button>
      </div>
      <div class="stock-table-container" id="stock-table-container">
        <div class="loading-market">Loading market data…</div>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- Chat WebSocket ----------
    let socket;
    let sessionId = localStorage.getItem("session_id");
    const messagesContainer = document.getElementById("messages");
    const chatStatus = document.getElementById("chat-status");
    const promptInput = document.getElementById("prompt");
    let currentAssistantBubble = null; // tracks the bubble for the ongoing assistant reply

    function createAssistantBubble() {
      const bubble = document.createElement("div");
      bubble.className = "message-bubble assistant-bubble";
      messagesContainer.appendChild(bubble);
      return bubble;
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function connectChat() {
      const protocol = window.location.protocol === "https:" ? "wss" : "ws";
      let url = `${protocol}://${window.location.host}/api/v1/chat`;
      if (sessionId) {
        url += `?session_id=${sessionId}`;
      }

      socket = new WebSocket(url);

      socket.onopen = () => {
        chatStatus.innerHTML = "🟢 Connected";
        console.log("🔌 WebSocket connected to:", url);
      };

      socket.onmessage = (event) => {
        console.log("📩 Raw WebSocket message:", event.data);

        let data;
        try {
          data = JSON.parse(event.data);
        } catch (e) {
          // Plain text fallback
          console.warn("Non-JSON message received, treating as text:", event.data);
          if (!currentAssistantBubble) {
            currentAssistantBubble = createAssistantBubble();
          }
          currentAssistantBubble.textContent += event.data;
          scrollToBottom();
          return;
        }

        console.log("📦 Parsed message:", data);

        // --- Session handling ---
        if (data.type === "session" || data.type === "session_id") {
          sessionId = data.session_id || data.sessionId || data.id;
          if (sessionId) {
            localStorage.setItem("session_id", sessionId);
            console.log("✅ Chat session:", sessionId);
          }
          return;
        }

        // --- Streaming token ---
        if (data.type === "token" || data.type === "chunk" || data.type === "stream") {
          const content = data.content || data.text || data.data || "";
          if (!content) return;

          if (!currentAssistantBubble) {
            currentAssistantBubble = createAssistantBubble();
          }
          currentAssistantBubble.textContent += content;
          scrollToBottom();
          return;
        }

        // --- Complete response (non‑streaming) ---
        if (data.type === "response" || data.type === "message" || data.type === "done" || data.type === "complete") {
          const content = data.content || data.message || data.text || data.response || data.data || "";
          if (content) {
            // If we already have a streaming bubble, we can just keep it (it already has the full stream).
            // But if we don't, create a new bubble with the full content.
            if (!currentAssistantBubble) {
              currentAssistantBubble = createAssistantBubble();
              currentAssistantBubble.textContent = content;
            } else {
              // Optionally, we could replace the content with the final content if needed.
              // But typically the stream already accumulated everything, so we leave it.
            }
          }
          // If this is a "done" signal, mark the current stream as finished.
          if (data.type === "done") {
            currentAssistantBubble = null;
          }
          scrollToBottom();
          return;
        }

        // --- Error handling ---
        if (data.type === "error" || data.error) {
          const errorMsg = data.message || data.error || "An error occurred";
          const bubble = document.createElement("div");
          bubble.className = "message-bubble assistant-bubble";
          bubble.style.background = "#fee2e2";
          bubble.style.color = "#b91c1c";
          bubble.textContent = "⚠️ " + errorMsg;
          messagesContainer.appendChild(bubble);
          scrollToBottom();
          return;
        }

        // --- Fallback: try to find any content field ---
        const content = data.content || data.message || data.text || data.response || data.data || data.answer || data.reply;
        if (content) {
          if (!currentAssistantBubble) {
            currentAssistantBubble = createAssistantBubble();
          }
          currentAssistantBubble.textContent += content;
          scrollToBottom();
          return;
        }

        console.warn("⚠️ Unknown message format:", data);
      };

      socket.onclose = () => {
        chatStatus.innerHTML = "🔴 Disconnected, reconnecting...";
        setTimeout(connectChat, 2000);
      };

      socket.onerror = () => {
        socket.close();
      };
    }

    function sendMessage() {
      const text = promptInput.value.trim();
      if (text === "" || !socket || socket.readyState !== WebSocket.OPEN) return;

      // Create user bubble
      const userBubble = document.createElement("div");
      userBubble.className = "message-bubble user-bubble";
      userBubble.textContent = text;
      messagesContainer.appendChild(userBubble);

      // Reset assistant bubble reference for the new response
      currentAssistantBubble = null;

      socket.send(text);
      promptInput.value = "";
      promptInput.focus();
      scrollToBottom();
    }

    // Clear chat
    document.getElementById("clear-chat").addEventListener("click", () => {
      while (messagesContainer.firstChild) {
        messagesContainer.removeChild(messagesContainer.firstChild);
      }
      currentAssistantBubble = null;
    });

    document.getElementById("send").addEventListener("click", sendMessage);
    promptInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    connectChat();

    // ---------- Market Data ----------
    const API_URL = "https://nigerian-stocks.onrender.com/api/v1/markets/ngx/live";
    const marketStatusDot = document.getElementById("status-dot");
    const exchangeStatusSpan = document.getElementById("exchange-status");
    const lastUpdatedSpan = document.getElementById("market-last-updated");
    const stockTableContainer = document.getElementById("stock-table-container");
    const searchInput = document.getElementById("stock-search");
    const refreshBtn = document.getElementById("refresh-market");

    let allTickers = [];
    let marketInfo = { exchange: "NGX", status: "UNKNOWN", last_updated: null };

    function formatPrice(val) { return val != null ? Number(val).toFixed(2) : "—"; }
    function formatVolume(val) { return val != null ? Number(val).toLocaleString() : "—"; }
    function formatChangePct(val) {
      if (val == null) return "—";
      const num = Number(val);
      return (num >= 0 ? "+" : "") + num.toFixed(2) + "%";
    }
    function getChangeClass(val) {
      if (val == null || val === 0) return "neutral";
      return val > 0 ? "positive" : "negative";
    }
    function escapeHtml(text) {
      if (!text) return "";
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderTable(tickers) {
      if (!tickers.length) {
        stockTableContainer.innerHTML = `<div class="loading-market">No tickers to display.</div>`;
        return;
      }
      let html = `<table><thead><tr>
        <th>Symbol</th><th>Name</th><th>Price (₦)</th><th>Change</th><th>Change %</th><th>Volume</th>
      </tr></thead><tbody>`;
      tickers.forEach(t => {
        const changeClass = getChangeClass(t.change);
        const changePctClass = getChangeClass(t.change_pct);
        html += `<tr class="stock-row">
          <td><strong>${escapeHtml(t.symbol)}</strong></td>
          <td>${escapeHtml(t.name || t.symbol)}</td>
          <td>₦${formatPrice(t.price)}</td>
          <td class="${changeClass}">${t.change != null ? (t.change >= 0 ? '+' : '') + t.change.toFixed(2) : '—'}</td>
          <td class="${changePctClass}">${formatChangePct(t.change_pct)}</td>
          <td>${formatVolume(t.volume)}</td>
        </tr>`;
      });
      html += `</tbody></table>`;
      stockTableContainer.innerHTML = html;
    }

    function updateMarketUI() {
      if (marketInfo.status) {
        const statusLower = marketInfo.status.toLowerCase();
        exchangeStatusSpan.textContent = marketInfo.status.charAt(0) + marketInfo.status.slice(1).toLowerCase();
        marketStatusDot.className = "status-dot " + (statusLower === "open" ? "open" : "closed");
      }
      if (marketInfo.last_updated) {
        const date = new Date(marketInfo.last_updated);
        lastUpdatedSpan.textContent = "Updated " + date.toLocaleTimeString();
      } else {
        lastUpdatedSpan.textContent = "No update";
      }
    }

    function filterAndRender() {
      const query = searchInput.value.trim().toLowerCase();
      if (!query) {
        renderTable(allTickers);
        return;
      }
      const filtered = allTickers.filter(t => 
        t.symbol.toLowerCase().includes(query) || 
        (t.name && t.name.toLowerCase().includes(query))
      );
      renderTable(filtered);
    }

    async function fetchMarketData() {
      try {
        stockTableContainer.innerHTML = '<div class="loading-market">🔄 Refreshing market data…</div>';
        const response = await fetch(API_URL, { headers: { 'accept': 'application/json' } });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        marketInfo = {
          exchange: data.exchange || "NGX",
          status: data.status || "UNKNOWN",
          last_updated: data.last_updated || null
        };
        allTickers = data.tickers || [];
        updateMarketUI();
        filterAndRender();
      } catch (err) {
        console.error("Market fetch error:", err);
        stockTableContainer.innerHTML = `<div class="error-message">⚠️ Unable to load market data. ${escapeHtml(err.message)}</div>`;
      }
    }

    searchInput.addEventListener("input", filterAndRender);
    refreshBtn.addEventListener("click", fetchMarketData);

    fetchMarketData();
    const marketInterval = setInterval(fetchMarketData, 7 * 24 * 60 * 60 * 1000); // 7 days
    window.addEventListener("beforeunload", () => clearInterval(marketInterval));
  })();
</script>
</body>
</html>
