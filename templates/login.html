<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NGX AI – Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(145deg, #202a43, #346cb6);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .auth-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 2.5rem 2rem;
      border-radius: 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .auth-card h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #0b2b5e;
      margin-bottom: 0.3rem;
    }
    .auth-card p {
      color: #4b5563;
      margin-bottom: 1.8rem;
    }
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .tab-btn {
      flex: 1;
      padding: 0.7rem;
      border: none;
      border-radius: 2rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      background: #e5e7eb;
      color: #4b5563;
    }
    .tab-btn.active {
      background: #2563eb;
      color: white;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      font-weight: 500;
      color: #1f2937;
      margin-bottom: 0.3rem;
      font-size: 0.9rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1.5px solid #d1d5db;
      border-radius: 1.5rem;
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
      background: white;
    }
    .form-group input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .btn-primary {
      width: 100%;
      padding: 0.8rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .error-msg {
      color: #b91c1c;
      background: #fee2e2;
      padding: 0.5rem 1rem;
      border-radius: 1rem;
      margin-bottom: 1rem;
      display: none;
    }
    .toggle-link {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
    }
    .toggle-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }
    .toggle-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <h1>📈 NGX AI</h1>
    <p>Sign in to access your investment dashboard</p>
    <div class="tabs">
      <button class="tab-btn active" id="login-tab">Login</button>
      <button class="tab-btn" id="signup-tab">Sign Up</button>
    </div>

    <div id="error-message" class="error-msg"></div>

    <!-- Login Form -->
    <form id="login-form" style="display: block;">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" id="login-email" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" id="login-password" required />
      </div>
      <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <!-- Signup Form -->
    <form id="signup-form" style="display: none;">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="fullname" id="signup-fullname" required />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" id="signup-email" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" id="signup-password" required />
      </div>
      <button type="submit" class="btn-primary">Create Account</button>
    </form>

    <div class="toggle-link">
      <span id="toggle-text">Don't have an account? <a id="toggle-action">Sign up</a></span>
    </div>
  </div>

  <script>
    (function () {
      const loginForm = document.getElementById('login-form');
      const signupForm = document.getElementById('signup-form');
      const loginTab = document.getElementById('login-tab');
      const signupTab = document.getElementById('signup-tab');
      const toggleAction = document.getElementById('toggle-action');
      const toggleText = document.getElementById('toggle-text');
      const errorMsg = document.getElementById('error-message');

      function showError(msg) {
        errorMsg.style.display = 'block';
        errorMsg.textContent = msg;
      }
      function clearError() {
        errorMsg.style.display = 'none';
      }

      function setActiveTab(tab) {
        loginTab.classList.toggle('active', tab === 'login');
        signupTab.classList.toggle('active', tab === 'signup');
        loginForm.style.display = tab === 'login' ? 'block' : 'none';
        signupForm.style.display = tab === 'signup' ? 'block' : 'none';
        toggleText.innerHTML =
          tab === 'login'
            ? `Don't have an account? <a id="toggle-action">Sign up</a>`
            : `Already have an account? <a id="toggle-action">Login</a>`;
        document.getElementById('toggle-action').addEventListener('click', () => {
          setActiveTab(tab === 'login' ? 'signup' : 'login');
        });
        clearError();
      }

      loginTab.addEventListener('click', () => setActiveTab('login'));
      signupTab.addEventListener('click', () => setActiveTab('signup'));
      document.getElementById('toggle-action').addEventListener('click', () => {
        const current = loginForm.style.display === 'none' ? 'signup' : 'login';
        setActiveTab(current === 'login' ? 'signup' : 'login');
      });

      // ---------- Login ----------
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        try {
          const res = await fetch('/auth/signin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });
          const data = await res.json();
          if (!res.ok) {
            showError(data.detail || 'Login failed');
            return;
          }
          // Store token in localStorage for WebSocket
          localStorage.setItem('access_token', data.access_token);
          // Redirect to dashboard
          window.location.href = '/dashboard';
        } catch (err) {
          showError('Network error, please try again.');
        }
      });

      // ---------- Signup ----------
      signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();

        const fullname = document.getElementById('signup-fullname').value.trim();
        const email = document.getElementById('signup-email').value.trim();
        const password = document.getElementById('signup-password').value;

        try {
          const res = await fetch('/auth/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fullname, email, password }),
          });
          const data = await res.json();
          if (!res.ok) {
            showError(data.detail || 'Registration failed');
            return;
          }
          localStorage.setItem('access_token', data.access_token);
          window.location.href = '/dashboard';
        } catch (err) {
          showError('Network error, please try again.');
        }
      });
    })();
  </script>
</body>
</html>
